services:
  db_master:
    build: ./db
    container_name: db_master
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: telegram_bot
    command: >
      postgres
      -c wal_level=replica
      -c max_wal_senders=10
      -c max_replication_slots=10
      -c hot_standby=on
      -c log_replication_commands=on
      -c logging_collector=on
      -c log_directory=/logs
      -c log_filename=postgresql.log
    ports:
      - "5432:5432"
    volumes:
      - master_data:/var/lib/postgresql/data
      - ./logs:/logs
    networks:
      - app_network

  db_repl:
    build: ./db_repl
    container_name: db_repl
    environment:
      PGUSER: repl_user
      PGPASSWORD: repl_password
    command: >
      bash -c "
      /init-replica.sh &&
      exec docker-entrypoint.sh postgres -c hot_standby=on
      "
    depends_on:
      - db_master
    volumes:
      - repl_data:/var/lib/postgresql/data
    networks:
      - app_network

  bot:
    build: ./bot
    container_name: bot
    depends_on:
      - db_master
    network_mode: "host"
    dns:
      - 172.17.0.1
    volumes:
      - ./logs:/logs

volumes:
  master_data:
  repl_data:

networks:
  app_network:
